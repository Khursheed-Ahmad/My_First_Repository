<script>

let isListening = false;
let items = [];
let capturedPhrases = [];
let recognition = null;


/* DATE */

const dateOptions = {
  day: 'numeric',
  month: 'short',
  year: 'numeric'
};

const formattedDate =
  new Date().toLocaleDateString('hi-IN', dateOptions);

document.getElementById('currentDate').innerText =
  formattedDate;


/* ===========================
   DUPLICATE VOICE FIX
=========================== */

function normalizeVoiceText(text) {

  return text
    .trim()
    .replace(/[.,!?।]/g, ' ')
    .replace(/\s+/g, ' ')
    .toLowerCase();

}


/* Merge overlapping voice chunks */

function mergeVoiceChunk(oldText, newText) {

  const oldWords =
    normalizeVoiceText(oldText)
      .split(' ')
      .filter(Boolean);

  const newWords =
    normalizeVoiceText(newText)
      .split(' ')
      .filter(Boolean);


  if (oldWords.length === 0) {
    return newText.trim();
  }


  const oldNormalized =
    oldWords.join(' ');

  const newNormalized =
    newWords.join(' ');


  /* New text already exists */

  if (oldNormalized.includes(newNormalized)) {
    return oldText;
  }


  /* Old text already exists inside new text */

  if (newNormalized.includes(oldNormalized)) {
    return newText;
  }


  /* Find overlapping words */

  const maxOverlap =
    Math.min(oldWords.length, newWords.length);

  let overlap = 0;


  for (
    let size = maxOverlap;
    size >= 1;
    size--
  ) {

    const oldEnd =
      oldWords
        .slice(-size)
        .join(' ');

    const newStart =
      newWords
        .slice(0, size)
        .join(' ');


    if (oldEnd === newStart) {

      overlap = size;

      break;

    }

  }


  const mergedWords = [

    ...oldWords,

    ...newWords.slice(overlap)

  ];


  return mergedWords.join(' ');

}


/* Remove repeated consecutive words */

function removeDuplicateNameWords(words) {

  return words.filter(
    (word, index, array) => {

      if (index === 0) {
        return true;
      }

      return (
        word.toLowerCase() !==
        array[index - 1].toLowerCase()
      );

    }
  );

}


/* ===========================
   SPEECH RECOGNITION
=========================== */

if (
  'webkitSpeechRecognition' in window ||
  'SpeechRecognition' in window
) {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  recognition =
    new SpeechRecognition();


  recognition.lang = 'hi-IN';

  recognition.continuous = false;

  recognition.interimResults = false;


  recognition.onresult = (event) => {

    if (
      !event.results ||
      event.results.length === 0
    ) {
      return;
    }


    let chunk =
      event.results[0][0]
        .transcript
        .trim();


    if (!chunk) {
      return;
    }


    /* First chunk */

    if (
      capturedPhrases.length === 0
    ) {

      capturedPhrases.push(chunk);

    }


    /* Merge next voice chunks */

    else {

      let oldText =
        capturedPhrases.join(' ');


      let mergedText =
        mergeVoiceChunk(
          oldText,
          chunk
        );


      capturedPhrases = [
        mergedText
      ];

    }


    document
      .getElementById(
        'transcriptBox'
      )
      .innerText =
        `"${capturedPhrases.join(' ')}"`;

  };


  recognition.onerror = (e) => {

    console.log(
      "Speech Error:",
      e.error
    );

  };


  recognition.onend = () => {

    /* Restart while mic is held */

    if (isListening) {

      try {

        recognition.start();

      }

      catch (err) {

        console.log(err);

      }

    }

  };

}


/* ===========================
   MICROPHONE BUTTON
=========================== */

const micBtn =
  document.getElementById('micBtn');


const micLabel =
  document.getElementById('micLabel');


function startHold(e) {

  if (e) {

    e.preventDefault();

    e.stopPropagation();

  }


  if (isListening) {

    return;

  }


  isListening = true;

  capturedPhrases = [];


  micBtn.classList.add(
    'listening'
  );


  micLabel.innerText =
    "सुन रहे हैं... (छोड़ते ही परची बनेगी)";


  document
    .getElementById(
      'transcriptBox'
    )
    .innerText =
      "सुन रहे हैं...";


  try {

    recognition.start();

  }

  catch (err) {

    console.log(err);

  }

}


function stopHold(e) {

  if (e) {

    e.preventDefault();

    e.stopPropagation();

  }


  if (!isListening) {

    return;

  }


  isListening = false;


  micBtn.classList.remove(
    'listening'
  );


  micLabel.innerText =
    "दबाकर रखें और बोलें";


  try {

    recognition.stop();

  }

  catch (err) {

    console.log(err);

  }


  setTimeout(() => {

    let finalSentence =
      capturedPhrases
        .join(' ')
        .trim();


    if (
      finalSentence &&
      finalSentence !==
        "सुन रहे हैं..."
    ) {

      processVoiceSmart(
        finalSentence
      );

    }

  }, 500);

}


/* MOUSE */

micBtn.addEventListener(
  'mousedown',
  startHold
);


window.addEventListener(
  'mouseup',
  () => {

    if (isListening) {

      stopHold();

    }

  }
);


/* TOUCH */

micBtn.addEventListener(
  'touchstart',
  startHold,
  {
    passive: false
  }
);


window.addEventListener(
  'touchend',
  (e) => {

    if (isListening) {

      stopHold(e);

    }

  },
  {
    passive: false
  }
);


window.addEventListener(
  'touchcancel',
  (e) => {

    if (isListening) {

      stopHold(e);

    }

  },
  {

  }
);

   WORD CORRECTIONS
=========================== */

=========================== */

/* ===========================
   VOICE PARSER
=========================== */

function processVoiceSmart(text) {

  let clean =
    text.replace(
      /₹/g,
      ' ₹ '
    );


  /* Hindi numbers */

  for (
    let [k, v]
    of Object.entries(HINDI_NUMS)
  ) {

    clean =
      clean.replace(
        new RegExp(
          `\\b${k}\\b`,
          'gi'
        ),
        v
      );

  }


  /* Corrections */

  for (
    let [k, v]
    of Object.entries(CORRECTIONS)
  ) {

    clean =
      clean.replace(
        new RegExp(
          k,
          'gi'
        ),
        v
      );

  }


  let tokens =
    clean
      .split(/\s+/)
      .filter(Boolean);


  let parsedList = [];


  let currentNameWords = [];

  let currentQty = "";

  let currentQtyVal = 1;


  let unitRegex =
    /^(किलो|kg|kilo|लीटर|ltr|दर्जन|पैकेट|packet|पीस|ग्राम|gm|gram)$/i;


  let i = 0;


  while (
    i < tokens.length
  ) {

    let t =
      tokens[i];


    let cleanT =
      t.replace(
        /[₹,]/g,
        ''
      )
      .trim();


    let num =
      parseFloat(cleanT);


    /* Quantity */

    if (

      !isNaN(num) &&

      i + 1 < tokens.length &&

      unitRegex.test(
        tokens[i + 1]
      )

    ) {

      currentQtyVal =
        num;


      currentQty =
        `${num} ${tokens[i + 1]}`;


      i += 2;

      continue;

    }


    /* Price */

    else if (

      !isNaN(num) &&

      cleanT !== ""

    ) {

      let priceVal =
        num;


      if (

        i + 1 <
          tokens.length &&

        /^(रुपए|रुपये|रु|rs|rupees)$/i
          .test(
            tokens[i + 1]
          )

      ) {

        i++;

      }


      let filteredWords =
        currentNameWords.filter(

          w =>

            !STOP_WORDS.has(
              w.toLowerCase()
            )

            &&

            !unitRegex.test(w)

            &&

            w !== "₹"

        );


      /* IMPORTANT:
         Remove duplicate item names
      */

      filteredWords =
        removeDuplicateNameWords(
          filteredWords
        );


      let name =
        filteredWords
          .join(' ')
          .trim()

        ||

        "सामान";


      let finalPrice =
        priceVal;


      if (

        currentQty &&

        priceVal > 0

      ) {

        if (

          currentQty.includes(
            "ग्राम"
          )

          ||

          currentQty.includes(
            "gm"
          )

        ) {

          if (
            priceVal >= 100
          ) {

            finalPrice =
              (
                currentQtyVal /
                1000
              )
              *
              priceVal;

          }

          else {

            finalPrice =
              priceVal;

          }

        }

        else {

          finalPrice =
            currentQtyVal *
            priceVal;

        }

      }


      parsedList.push({

        item:
          name,

        quantity:
          currentQty,

        price:
          parseFloat(
            finalPrice.toFixed(2)
          )

      });


      currentNameWords = [];

      currentQty = "";

      currentQtyVal = 1;

    }


    /* Name */

    else {

      if (
        t !== "₹"
      ) {

        currentNameWords.push(
          t
        );

      }

    }


    i++;

  }


  /* Remaining words */

  let remainingWords =
    currentNameWords.filter(

      w =>

        !STOP_WORDS.has(
          w.toLowerCase()
        )

        &&

        !unitRegex.test(w)

        &&

        w !== "₹"

    );


  remainingWords =
    removeDuplicateNameWords(
      remainingWords
    );


  if (
    remainingWords.length > 0
  ) {

    parsedList.push({

      item:
        remainingWords
          .join(' ')
          .trim(),

      quantity:
        currentQty,

      price:
        0

    });

  }


  if (
    parsedList.length > 0
  ) {

    items =
      parsedList;


    renderParchi();

  }

}


/* ===========================
   RENDER PARCHI
=========================== */

function renderParchi() {

  const listEl =
    document.getElementById(
      'itemsList'
    );


  listEl.innerHTML = '';


  let total = 0;


  items.forEach(
    (it, idx) => {

      total += it.price;


      const li =
        document.createElement(
          'li'
        );


      li.className =
        'item-row';


      li.innerHTML = `

        <div class="item-name">

          <span>
            ${it.item}
          </span>

          ${
            it.quantity

              ?

              `<span style="
                font-size:13px;
                font-weight:normal;
                color:#4A5568;
                margin-left:4px;
              ">
                (${it.quantity})
              </span>`

              :

              ''

          }

        </div>


        <div class="dotted-lead"></div>


        <div class="item-price-section">

          <span class="currency-symbol">
            ₹
          </span>


          <span
            class="item-price-val"
            onclick="editPrice(${idx})"
          >
            ${it.price}
          </span>


          <span
            class="delete-item-btn"
            onclick="deleteItem(${idx})"
          >
            ✕
          </span>

        </div>

      `;


      listEl.appendChild(
        li
      );

    }
  );


  let formattedTotal =
    parseFloat(
      total.toFixed(2)
    );


  document
    .getElementById(
      'totalAmount'
    )
    .innerText =
      `₹${formattedTotal}`;

}


/* ===========================
   DELETE ITEM
=========================== */

function deleteItem(idx) {

  items.splice(
    idx,
    1
  );


  renderParchi();

}


/* ===========================
   EDIT PRICE
=========================== */

function editPrice(idx) {

  const newPrice =
    prompt(
      "नया भाव / Price दर्ज करें:",
      items[idx].price
    );


  if (

    newPrice !== null &&

    !isNaN(newPrice) &&

    newPrice.trim() !== ""

  ) {

    items[idx].price =
      parseFloat(
        parseFloat(
          newPrice
        )
        .toFixed(2)
      );


    renderParchi();

  }

}


/* ===========================
   RESET
=========================== */

function resetParcha() {

  items = [];

  capturedPhrases = [];


  document
    .getElementById(
      'transcriptBox'
    )
    .innerText =
      '"दबाकर रखें और बोलना शुरू करें..."';


  renderParchi();

}


/* ===========================
   MANUAL ENTRY
=========================== */

function manualTypeItem() {

  const name =
    prompt(
      "सामान का नाम:"
    );


  if (!name) {
    return;
  }


  const price =
    prompt(
      "रकम (Price):"
    );


  if (
    !price ||
    isNaN(price)
  ) {
    return;
  }


  items.push({

    item:
      name,

    quantity:
      "",

    price:
      parseFloat(
        parseFloat(price)
          .toFixed(2)
      )

  });


  renderParchi();

}


/* ===========================
   WHATSAPP
=========================== */

function sendToWhatsApp() {

  if (
    items.length === 0
  ) {

    alert(
      "परची खाली है! पहले सामान बोलें या दर्ज करें।"
    );

    return;

  }


  let phone =
    prompt(
      "ग्राहक का 10 अंकों का WhatsApp नंबर दर्ज करें:",
      ""
    );


  if (!phone) {

    return;

  }


  phone =
    phone.replace(
      /\D/g,
      ''
    );


  if (
    phone.length === 10
  ) {

    phone =
      "91" + phone;

  }


  else if (

    phone.length === 12 &&

    phone.startsWith(
      "91"
    )

  ) {

    /* Valid */

  }


  else {

    alert(
      "कृपया सही 10 अंकों का मोबाइल नंबर डालें।"
    );

    return;

  }


  let total =
    items.reduce(

      (sum, it) =>
        sum + it.price,

      0

    );


  let totalFormatted =
    parseFloat(
      total.toFixed(2)
    );


  const dateStr =
    document.getElementById(
      'currentDate'
    )
    .innerText;


  let msg =
    `\`\`\`॥ डिजिटल परची ॥\n`;


  msg +=
    `${dateStr}\n`;


  msg +=
    `----------------------------\n`;


  const TOTAL_WIDTH = 28;


  items.forEach(
    (it) => {

      let cleanItemName =
        it.item
          .replace(
            /\b(भी|का|की|के)\b/gi,
            ''
          )
          .trim();


      let qty =
        it.quantity
          ?
          ` (${it.quantity})`
          :
          '';


      let left =
        `${cleanItemName}${qty}`;


      let right =
        `₹ ${it.price}`;


      if (
        left.length > 18
      ) {

        left =
          left.substring(
            0,
            16
          )
          + "..";

      }


      let matras =
        left.match(
          /[\u093e-\u094f\u0901-\u0903]/g
        );


      let visualLen =
        left.length -

        (
          matras
            ?
            matras.length * 0.5
            :
            0
        );


      let dotsCount =
        Math.max(

          2,

          Math.round(

            TOTAL_WIDTH -

            visualLen -

            right.length

          )

        );


      let dots =
        ".".repeat(
          dotsCount
        );


      msg +=
        `${left} ${dots} ${right}\n`;

    }
  );


  let totalLeft =
    "कुल — TOTAL";


  let totalRight =
    `₹ ${totalFormatted}`;


  let totalMatras =
    totalLeft.match(
      /[\u093e-\u094f\u0901-\u0903]/g
    );


  let totalVisualLen =
    totalLeft.length -

    (
      totalMatras

        ?

        totalMatras.length * 0.5

        :

        0
    );


  let totalDotsCount =
    Math.max(

      2,

      Math.round(

        TOTAL_WIDTH -

        totalVisualLen -

        totalRight.length

      )

    );


  let totalDots =
    ".".repeat(
      totalDotsCount
    );


  msg +=
    `----------------------------\n`;


  msg +=
    `${totalLeft} ${totalDots} ${totalRight}\n`;


  msg +=
    `----------------------------\`\`\`\n\n`;


  msg +=
    `धन्यवाद! फिर पधारें। 🙏`;


  const encodedMsg =
    encodeURIComponent(
      msg
    );


  const isMobile =
    /Android|iPhone|iPad|iPod/i
      .test(
        navigator.userAgent
      );


  const waUrl =
    isMobile

      ?

      `whatsapp://send?phone=${phone}&text=${encodedMsg}`

      :

      `https://web.whatsapp.com/send?phone=${phone}&text=${encodedMsg}`;


  window.open(
    waUrl,
    '_blank'
  );

}


renderParchi();

</script>
